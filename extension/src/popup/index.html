<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OctoCounts Settings</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <img id="logoMark" class="logo-mark" alt="" aria-hidden="true">
    <span class="logo">OctoCounts</span>
  </header>

  <div id="noticeSection" class="notice-section" hidden>
    <span class="notice-icon">&#128274;</span>
    <span id="noticeText" class="notice-text"></span>
  </div>

  <div id="settingsSection">
    <div id="errorSection" class="error-section" hidden>
      <div class="error-header">
        <span class="error-icon">✕</span>
        <span class="error-title" id="errorTitle"></span>
        <button id="errorDismiss" class="error-dismiss" title="Dismiss">✕</button>
      </div>
      <div class="error-repo" id="errorRepo"></div>
      <div class="error-message" id="errorMessage"></div>
      <div class="error-meta">
        <span id="errorCode" class="error-code"></span>
        <span id="errorTime" class="error-time"></span>
      </div>
      <pre id="errorDetail" class="error-detail" hidden></pre>
      <button id="errorToggleDetail" class="error-detail-toggle" hidden></button>
      <div id="errorRetries" class="error-retries" hidden></div>
    </div>

    <div class="field row">
      <label for="autoAnalyze">Auto-analyze on page load</label>
      <input id="autoAnalyze" type="checkbox">
    </div>

    <div class="field">
      <label for="cardPlacement">OctoCounts position</label>
      <select id="cardPlacement">
        <option value="top">Top of right panel</option>
        <option value="bottom">Bottom of right panel</option>
      </select>
    </div>

    <div class="field row">
      <label for="replaceGhLanguages">Hide GitHub Languages section</label>
      <input id="replaceGhLanguages" type="checkbox">
    </div>

    <div class="field">
      <label for="cacheTtl">Cache TTL</label>
      <select id="cacheTtl">
        <option value="3600000">1 hour</option>
        <option value="21600000">6 hours</option>
        <option value="86400000">24 hours</option>
        <option value="604800000">7 days</option>
        <option value="0">Never expire</option>
      </select>
    </div>

    <div class="cache-actions">
      <button id="clearCache" class="btn-secondary">Clear local cache</button>
      <span id="clearCacheStatus" class="cache-status" hidden></span>
    </div>
  </div>

  <footer>
    v0.1.7 ·
    <a href="https://github.com/huanglizhuo/OctoCount/issues" target="_blank" rel="noopener noreferrer">
      Report issue
    </a>
  </footer>

  <script src="index.js" type="module"></script>
</body>
</html>
