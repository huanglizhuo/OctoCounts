<!--
  New GitHub code view: the sidebar is styled with CSS Modules, so every class
  carries a build hash. `__HASH__` is replaced with a fresh random value at test
  time — any test that passes only for one specific hash is a test of a bug.
-->
<html lang="en">

  <script type="application/json" data-target="react-app.embeddedData">
    {"payload":{"repo":{"name":"demo","ownerLogin":"octo","isPrivate":false,"visibility":"public","isFork":false},"codeViewRepoRoute":{"refInfo":{"name":"main"}}}}

</head>
<body>
