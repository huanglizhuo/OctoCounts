<!--
  A non-repository GitHub page that nonetheless has a two-segment path and a
  sidebar-shaped container with several headings. Dropping the old `.BorderGrid`
  gate made pages like this reachable, so both the route check and the
  repo-page signal have to reject it.
-->
<html lang="en">
<head>
  <title>GitHub Marketplace</title>
</head>
<body>
  <main>
    <div class="Layout">
      <div class="Layout-main">
        <h1>Some Action</h1>
        <p>Install this action in your workflow.</p>
      </div>
      <div class="Layout-sidebar">
        <div class="BorderGrid">
          <div class="BorderGrid-row"><div class="BorderGrid-cell"><h2>Pricing</h2><p>Free</p></div></div>
          <div class="BorderGrid-row"><div class="BorderGrid-cell"><h2>Category</h2><p>Utilities</p></div></div>
          <div class="BorderGrid-row"><div class="BorderGrid-cell"><h2>Links</h2><p>Homepage</p></div></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
