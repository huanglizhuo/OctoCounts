<!--
  Pre-migration GitHub sidebar: Primer `.BorderGrid` classes, and deliberately
  no repo-scoped links in the sidebar, so semantic resolution has to fall
  through to the legacy selector. The README does link to /octo/demo/releases —
  that link must not be mistaken for sidebar navigation.
-->
<html lang="en">
<head>
  <meta name="octolytics-dimension-repository_id" content="99">
  <meta name="octolytics-dimension-repository_is_private" content="false">
</head>
<body>
  <div class="AppHeader-context">
    <div class="AppHeader-context-compact"><a href="/octo/demo">octo/demo</a></div>
  </div>

  <main>
    <div class="Layout">
      <div class="Layout-main">
        <div id="readme">
          <article class="markdown-body">
            <h2>Install</h2>
            <p>Grab a build from the <a href="/octo/demo/releases">releases page</a>.</p>
            <p>Thanks to all <a href="/octo/demo/graphs/contributors">contributors</a>!</p>
          </article>
        </div>
      </div>

      <div class="Layout-sidebar">
        <div class="BorderGrid BorderGrid--spacious">
          <div class="BorderGrid-row">
            <div class="BorderGrid-cell">
              <h2>About</h2>
              <p>A demo repository</p>
            </div>
          </div>
          <div class="BorderGrid-row">
            <div class="BorderGrid-cell">
              <h2>Releases</h2>
              <span>No releases published</span>
            </div>
          </div>
          <div class="BorderGrid-row">
            <div class="BorderGrid-cell">
              <h2>Languages</h2>
              <ul>
                <li>Rust 80.0%</li>
                <li>Shell 20.0%</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
