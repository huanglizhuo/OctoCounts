name: Refresh llms-full.txt compare section

# Regenerate the curated-comparison block of llms-full.txt from the compare
# registry so the list can never drift from the routes the edge function
# serves. Dates are NOT touched: they are per-page records of real content
# change, maintained by hand via frontend/content/content-manifest.json.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-llms-lastupdated
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Regenerate compare pages section
        run: node scripts/refresh-llms-lastupdated.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/llms-full.txt
          if git diff --cached --quiet; then
            echo "llms-full.txt compare section already current"
          else
            git commit -m "chore: refresh llms-full.txt compare section"
            git push origin HEAD:main
          fi
