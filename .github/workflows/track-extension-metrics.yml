name: Track extension store metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: track-extension-metrics
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Fetch extension store metrics
        run: |
          node --test scripts/track-extension-metrics.test.mjs
          node scripts/track-extension-metrics.mjs

      - name: Publish metrics snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extension-metrics.jsonl
          if git diff --cached --quiet; then
            echo "Metrics snapshot is unchanged"
          else
            git commit -m "chore: track extension store metrics"
            git push origin HEAD:main
          fi
