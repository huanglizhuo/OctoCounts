name: Build browser extensions

on:
  push:
    branches: [main]
    tags:
      - "extension-v*"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension-release.yml"
  workflow_dispatch:

# Read-only by default: the build runs `npm ci` (third-party install scripts)
# on every push and PR, so only the tag-only publish job can write.
permissions:
  contents: read

jobs:
  build:
    name: Build Chrome, Edge, and Firefox extensions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      chrome_zip: ${{ steps.package.outputs.chrome_zip }}
      edge_zip: ${{ steps.package.outputs.edge_zip }}
      firefox_zip: ${{ steps.package.outputs.firefox_zip }}

    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm test` is the DOM unit tests, all three builds, then the
      # build-artifact checks, so a broken detector never reaches a store.
      - name: Test and build extensions
        env:
          EDGE_STORE_URL: ${{ secrets.EDGE_STORE_URL }}
          EDGE_STORE_REVIEW_URL: ${{ secrets.EDGE_STORE_REVIEW_URL }}
        run: npm test

      - name: Compute package names
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#extension-v}"
          if [[ "$version" == "$GITHUB_REF_NAME" ]]; then
            version="$(node -p "require('./package.json').version")"
          fi
          short_sha="$(git rev-parse --short=8 HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "chrome_zip=octocounts-chrome-v${version}-${short_sha}.zip" >> "$GITHUB_OUTPUT"
          echo "edge_zip=octocounts-edge-v${version}-${short_sha}.zip" >> "$GITHUB_OUTPUT"
          echo "firefox_zip=octocounts-firefox-v${version}-${short_sha}.zip" >> "$GITHUB_OUTPUT"

      - name: Package extensions
        env:
          EDGE_STORE_URL: ${{ secrets.EDGE_STORE_URL }}
          EDGE_STORE_REVIEW_URL: ${{ secrets.EDGE_STORE_REVIEW_URL }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/extension-v* ]]; then
            node scripts/package-artifacts.mjs --release
          else
            node scripts/package-artifacts.mjs
          fi

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.chrome_zip }}
          path: extension/packages/${{ steps.package.outputs.chrome_zip }}
          if-no-files-found: error

      - name: Upload Edge extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.edge_zip }}
          path: extension/packages/${{ steps.package.outputs.edge_zip }}
          if-no-files-found: error

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.firefox_zip }}
          path: extension/packages/${{ steps.package.outputs.firefox_zip }}
          if-no-files-found: error

  # Store upload runs only for extension-v* tags (never for main pushes or
  # PRs, which reuse this workflow for build checks). Both stores queue their
  # own review after the upload; this job only proves the API accepted it.
  # Third-party actions here hold store credentials, so they are pinned to
  # commits: a moved tag cannot ship a malicious update to every user.
  publish:
    name: Publish to Chrome Web Store & Edge Add-ons
    needs: build
    if: startsWith(github.ref, 'refs/tags/extension-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: OctoCounts Extension v${{ needs.build.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/${{ needs.build.outputs.chrome_zip }}/${{ needs.build.outputs.chrome_zip }}
            artifacts/${{ needs.build.outputs.edge_zip }}/${{ needs.build.outputs.edge_zip }}
            artifacts/${{ needs.build.outputs.firefox_zip }}/${{ needs.build.outputs.firefox_zip }}

      - name: Publish Chrome zip to the Web Store
        uses: wdzeng/chrome-extension@37f4f9cdc664959bafef36b1f4da03dec5141620 # v2.0.0
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          # Chrome Web Store API v2 addresses items under their publisher.
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          zip-path: artifacts/${{ needs.build.outputs.chrome_zip }}/${{ needs.build.outputs.chrome_zip }}

      - name: Publish Edge zip to Add-ons
        # The stores are independent; one rejecting a duplicate submission
        # (e.g. "already in review" on a rerun) must not block the other.
        if: always() && steps.release.outcome == 'success'
        uses: wdzeng/edge-addon@9881f57720358040d079eaa06a4596dc9c273eb6 # v2.1.1
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          zip-path: artifacts/${{ needs.build.outputs.edge_zip }}/${{ needs.build.outputs.edge_zip }}
