name: Refresh GitHub Trending reports

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum Trending repositories to cache"
        required: false
        default: "20"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-github-trending
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Fetch and validate GitHub Trending
        id: snapshot
        env:
          LIMIT: ${{ github.event.inputs.limit || '20' }}
        run: |
          node --test scripts/refresh-github-trending.test.mjs scripts/publish-github-trending.test.mjs
          node scripts/refresh-github-trending.mjs --limit "$LIMIT"

      - name: Cache Trending SLOC reports
        timeout-minutes: 100
        env:
          LIMIT: ${{ github.event.inputs.limit || '20' }}
        run: |
          node scripts/seed-popular-repos.mjs \
            --file data/github-trending-repos.txt \
            --source github_trending \
            --limit "$LIMIT" \
            --concurrency 2 \
            --delay-ms 750 \
            --max-polls 180

      - name: Add cached SLOC to the snapshot
        id: enrich
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        run: node scripts/refresh-github-trending.mjs --enrich-only

      - name: Publish daily snapshot
        if: ${{ !cancelled() && steps.enrich.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publish-github-trending.mjs
