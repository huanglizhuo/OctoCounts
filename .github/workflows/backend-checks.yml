name: Backend checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without it every database-backed test skips itself and passes vacuously.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      # The toolchain the production image builds with, so CI rejects code the
      # image could not compile.
      - name: Install the Dockerfile's Rust toolchain
        run: |
          toolchain=$(sed -nE 's/^FROM rust:([0-9.]+).*/\1/p' Dockerfile)
          rustup toolchain install "$toolchain" --profile minimal --component clippy,rustfmt
          rustup default "$toolchain"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: backend-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock', 'backend/Dockerfile') }}
          restore-keys: backend-${{ runner.os }}-

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
