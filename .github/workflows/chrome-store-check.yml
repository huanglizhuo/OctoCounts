name: Check Chrome Web Store access

# Read-only: proves the publish credentials, the publisher ID and the item ID
# all work against the Chrome Web Store API v2 (what release publishing uses
# since wdzeng/chrome-extension v2) without uploading or publishing anything.
# Run it after changing any CHROME_* secret, so a bad value shows up here
# instead of halfway through a release.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the item's status
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          set -euo pipefail
          # Same token exchange and endpoint as the publish action.
          response=$(curl -sS https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")
          token=$(jq -r '.access_token // empty' <<<"$response")
          if [ -z "$token" ]; then
            # Only Google's error code and description: no secret is echoed.
            echo "token exchange failed: $(jq -c '{error, error_description}' <<<"$response")"
            exit 1
          fi
          echo "::add-mask::$token"
          curl -sS --fail-with-body -H "Authorization: Bearer $token" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:fetchStatus" | jq .
