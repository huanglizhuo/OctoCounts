# One grouped PR per ecosystem per week for minor and patch updates, so they
# arrive as a reviewable batch. Major updates are left out of the groups and
# open as PRs of their own: each needs a decision (tokei changes the counts,
# TypeScript 7 drops the compiler API the tests use, a new Node line must move
# CI too), and one blocked major must not hold the safe updates back.
# CLI, MCP and Action have no dependencies.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # A tokei major changes the counts and must move TOKEI_VERSION in
      # backend/src/analyzer.rs and the methodology docs with it, so it is
      # upgraded by hand (see the tokei 15 PR), never by a bot.
      - dependency-name: tokei
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directories: ["/frontend", "/extension"]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/mcp"]
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
