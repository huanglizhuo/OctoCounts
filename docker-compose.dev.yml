name: octocount-dev

services:
  api-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:8080}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/sloc-dev.db}
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-2}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./backend:/app
      - backend-target:/app/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - dev-data:/data
    ports:
      - "8080:8080"

  web-dev:
    image: node:23-bookworm-slim
    working_dir: /app
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://127.0.0.1:8080}
    command: sh -c "npm ci && npm exec vite -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api-dev

volumes:
  backend-target:
  cargo-registry:
  cargo-git:
  dev-data:
  frontend-node-modules:
