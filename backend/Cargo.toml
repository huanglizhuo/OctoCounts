[package]
name = "octocount-service"
version = "0.1.3"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.11"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
resvg = "0.47"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls", "uuid"] }
tar = "0.4"
tempfile = "3.27"
thiserror = "2.0"
tokei = "14.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
moka = { version = "0.12", features = ["future"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.23", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
