services:
  api:
    build:
      context: ./backend
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: sqlite:///data/sloc.db
      ANALYSIS_CONCURRENCY: "2"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - sloc-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sloc-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:?set CLOUDFLARED_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

  tunnel-watchdog:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TARGET_CONTAINER: sloc-cloudflared
      HEALTH_URL: http://api:8080/healthz
      CHECK_INTERVAL_SECONDS: "10"
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          if wget -q -T 3 -O - "$$HEALTH_URL" >/dev/null 2>&1; then
            docker start "$$TARGET_CONTAINER" >/dev/null 2>&1 || true
          else
            docker stop -t 5 "$$TARGET_CONTAINER" >/dev/null 2>&1 || true
          fi
          sleep "$$CHECK_INTERVAL_SECONDS"
        done
    depends_on:
      - api
      - cloudflared
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://127.0.0.1:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  sloc-data:
