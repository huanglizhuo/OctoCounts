services:
  api:
    build:
      context: ./backend
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      DATABASE_ACQUIRE_TIMEOUT_SECONDS: ${DATABASE_ACQUIRE_TIMEOUT_SECONDS:-10}
      ANALYSIS_CONCURRENCY: "2"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-3600}
      JOB_RETENTION_COMPLETED_DAYS: ${JOB_RETENTION_COMPLETED_DAYS:-1}
      JOB_RETENTION_STALE_HOURS: ${JOB_RETENTION_STALE_HOURS:-6}
      REPORT_MIN_RETENTION_DAYS: ${REPORT_MIN_RETENTION_DAYS:-30}
      REPORT_MAX_ROWS: ${REPORT_MAX_ROWS:-20000}
      REPORT_CLEANUP_BATCH_SIZE: ${REPORT_CLEANUP_BATCH_SIZE:-1000}
      # IndexNow: the same INDEXNOW_KEY must also be set on Cloudflare Pages,
      # which serves https://<INDEXNOW_HOST>/<INDEXNOW_KEY>.txt via a Pages function.
      # Enabled by default: without INDEXNOW_KEY set the backend just logs a
      # warning and skips submissions, so defaulting on is safe.
      INDEXNOW_ENABLED: ${INDEXNOW_ENABLED:-true}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      INDEXNOW_HOST: ${INDEXNOW_HOST:-octocounts.com}
      INDEXNOW_KEY_LOCATION: ${INDEXNOW_KEY_LOCATION:-}
      INDEXNOW_BATCH_SIZE: ${INDEXNOW_BATCH_SIZE:-100}
      INDEXNOW_MAX_RETRIES: ${INDEXNOW_MAX_RETRIES:-3}
      INDEXNOW_TIMEOUT_SECONDS: ${INDEXNOW_TIMEOUT_SECONDS:-10}
      INDEXNOW_DRY_RUN: ${INDEXNOW_DRY_RUN:-false}
      INDEXNOW_ENDPOINT: ${INDEXNOW_ENDPOINT:-}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # Tunnel services are opt-in: `docker compose --profile tunnel up -d`.
  #
  # A Cloudflare Tunnel token identifies a tunnel, not a machine. Any cloudflared
  # process started with the production token registers as a connector and
  # Cloudflare begins routing real api.octocounts.com traffic to it within
  # seconds. On 2026-08-04 a laptop running this file did exactly that, serving
  # production from a locally built image that predated every /api/seo/* route,
  # so those endpoints 404ed for whoever landed on it -- while /healthz stayed
  # green and the edge cache masked it for weeks.
  #
  # Without the profile these two never start, so `docker compose up` gives you
  # a local api and web and nothing that can reach production. Deploys go
  # through sloc-infra on the VPS nodes.
  #
  # The token uses `:-` rather than `:?` on purpose. Compose interpolates every
  # service before it applies profiles, so a `:?` guard here fails the whole
  # file -- including `docker compose up api` -- rather than just this service.
  # The profile is what provides the isolation; an absent token then makes
  # cloudflared exit immediately instead of connecting to anything.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: sloc-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - api
    restart: unless-stopped

  tunnel-watchdog:
    profiles: ["tunnel"]
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TARGET_CONTAINER: sloc-cloudflared
      HEALTH_URL: http://api:8080/healthz
      CHECK_INTERVAL_SECONDS: "10"
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          if wget -q -T 3 -O - "$$HEALTH_URL" >/dev/null 2>&1; then
            docker start "$$TARGET_CONTAINER" >/dev/null 2>&1 || true
          else
            docker stop -t 5 "$$TARGET_CONTAINER" >/dev/null 2>&1 || true
          fi
          sleep "$$CHECK_INTERVAL_SECONDS"
        done
    depends_on:
      - api
      - cloudflared
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: http://127.0.0.1:8080
    ports:
      - "5173:80"
    depends_on:
      - api
