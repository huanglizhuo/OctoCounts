          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SLOC stands for Source Lines of Code. It is a software metric used to measure the size of a program by counting the lines in its source code. Unlike raw line count, SLOC distinguishes between code lines (actual instructions the compiler or interpreter processes), comment lines (documentation and explanations), and blank lines (whitespace). This breakdown matters because a 10,000-line file that is 40% comments tells a different story than one that is 95% code. Developers use SLOC to estimate project complexity, compare codebases when evaluating dependencies, scope billing and audit work, and communicate repository size to stakeholders who may not read code. OctoCounts reports SLOC at two levels: per programming language and as aggregate totals across the entire repository. The underlying counter is tokei, which is significantly faster than alternatives like cloc or sloccount because it is written in Rust and uses parallel file processing."
          }

          "@type": "Question",
          "name": "Why use OctoCounts instead of cloning and running tokei locally?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "OctoCounts is faster for large repositories because it downloads a compressed archive tarball rather than a full git clone with history. A git clone transfers every commit object, tree object, and blob in the repository's history — for a long-lived project this can mean hundreds of megabytes or gigabytes of data even if the current source tree is small. OctoCounts fetches only the archive of the working tree at the requested ref, which is typically 10–50x smaller. Additionally, there is nothing to install. No git, no Rust toolchain, no tokei binary — just paste a GitHub URL into the web app or install the browser extension once. Results are cached by commit SHA and tokei version, so any repeated analysis of the same commit returns instantly with zero re-download and zero re-processing. This makes OctoCounts especially useful for quickly evaluating dependencies or unfamiliar repositories without setting up a local environment."
          }

        <h1>OctoCounts — The SLOC Panel GitHub Forgot</h1>
        <p><time datetime="2026-05-04">Updated May 2026.</time> GitHub shows language bars, but it does not show actual files, code lines, comments, blanks, or per-language totals. OctoCounts is a free GitHub SLOC counter for public repositories. Install <a href="https://chromewebstore.google.com/detail/octocounts-%E2%80%94-github-sloc/gkgjpjdnaklagijmekoolhcpebmoldbj">OctoCounts from the Chrome Web Store</a> or <a href="https://addons.mozilla.org/en-US/firefox/addon/octocounts-github-sloc">OctoCounts from Firefox Add-ons</a> to see SLOC directly in GitHub's repo sidebar, or paste a public repo URL into the web app for a full report. OctoCounts downloads the archive tarball, runs <a href="https://github.com/XAMPPRocky/tokei">tokei</a>, caches the result by commit SHA, and returns a sortable breakdown without cloning.</p>

        <h2>Why use OctoCounts instead of cloning and running tokei locally?</h2>
        <p>OctoCounts downloads a compressed archive tarball rather than a full git clone with history, which is significantly faster for large repositories. It caches results by commit SHA and tokei version, so any repeated analysis of the same commit returns instantly with zero re-processing. There is nothing to install — paste a GitHub URL and get results in seconds.</p>

        <h2>What is OctoCounts?</h2>
        <p>OctoCounts is a source lines of code (SLOC) counter for GitHub repositories with two entry points: browser extensions for GitHub repo pages and a web app for pasted public repo URLs. The extension adds a sidebar card on GitHub, then opens a full panel with files, total lines, code lines, comment lines, blank lines, language rows, local cache, auto-analyze settings, and placement settings. The web app resolves the requested branch, tag, or commit SHA via the GitHub API, downloads the archive tarball, runs tokei in a background worker, and returns a language-by-language breakdown. Results are cached by commit SHA and tokei version so repeat queries are instant.</p>

        <h2>How does OctoCounts work?</h2>
        <ol>
          <li><strong>Resolve:</strong> OctoCounts validates the GitHub URL and pins the run to a specific commit SHA using the GitHub API.</li>
          <li><strong>Count:</strong> The Rust backend (Axum + Tokio) downloads the repository archive, extracts it, and runs tokei for language statistics in a queued worker job.</li>
          <li><strong>Cache:</strong> Reports are stored by owner, repo, commit SHA, and tokei version. Re-analysis of the same commit is instant — no re-download, no re-count.</li>
        </ol>

        <h2>Frequently Asked Questions</h2>

        <h3>What is SLOC?</h3>
        <p>SLOC stands for Source Lines of Code. It is a software metric used to measure the size of a program by counting lines in its source code. OctoCounts reports total lines, code lines, comment lines, and blank lines per language, plus aggregate totals across the repository.</p>

        <h3>What programming languages does OctoCounts support?</h3>
        <p>OctoCounts uses tokei for language detection, which supports over 200 programming languages and file types including Rust, Python, JavaScript, TypeScript, Go, Java, C, C++, Ruby, Swift, Kotlin, and many more.</p>
