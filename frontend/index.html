      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is SLOC?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SLOC stands for Source Lines of Code. It is a software metric used to measure the size of a program by counting the lines in its source code. Unlike raw line count, SLOC distinguishes between code lines (actual instructions the compiler or interpreter processes), comment lines (documentation and explanations), and blank lines (whitespace). This breakdown matters because a 10,000-line file that is 40% comments tells a different story than one that is 95% code.\n\nDevelopers use SLOC to estimate project complexity, compare codebases when evaluating dependencies, scope billing and audit work, and communicate repository size to stakeholders who may not read code. OctoCounts reports SLOC at two levels: per programming language and as aggregate totals across the entire repository. The underlying counter is tokei, which is significantly faster than alternatives like cloc or sloccount because it is written in Rust and uses parallel file processing."
          }
        },
        {
          "@type": "Question",
          "name": "Why use OctoCounts instead of cloning and running tokei locally?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "OctoCounts is faster for large repositories because it downloads a compressed archive tarball rather than a full git clone with history. A git clone transfers every commit object, tree object, and blob in the repository's history. For a long-lived project this can mean hundreds of megabytes or gigabytes of data even if the current source tree is small. OctoCounts fetches only the archive of the working tree at the requested ref, which is typically 10-50x smaller.\n\nAdditionally, there is nothing to install. No git, no Rust toolchain, no tokei binary. Just paste a GitHub URL into the web app or install the browser extension once. Results are cached by commit SHA and tokei version, so any repeated analysis of the same commit returns instantly with zero re-download and zero re-processing. This makes OctoCounts especially useful for quickly evaluating dependencies or unfamiliar repositories without setting up a local environment."
          }
        },
        {
          "@type": "Question",
          "name": "Does OctoCounts have a browser extension?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. OctoCounts has browser extensions for Chrome, Edge, and Firefox, all named OctoCounts – GitHub SLOC & Code Statistics. Install from the Chrome Web Store, Microsoft Edge Add-ons, or Firefox Add-ons to add a compact SLOC card directly to GitHub repository sidebars. The card appears automatically on any public repository page and shows the total line count and analysis status. Clicking the card opens the full panel, which displays files, total lines, code lines, comment lines, and blank lines per language, the same breakdown as the web app.\n\nThe extension includes a local cache so results load instantly on repeat visits to the same repository and ref. You can configure the auto-analyze setting to fetch counts immediately on page load, or trigger analysis manually. The placement setting controls where the card appears in the GitHub sidebar. No GitHub account or API token is required. The extension source code is publicly available on GitHub."
          }
        },
        {
          "@type": "Question",
          "name": "Is OctoCounts free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. OctoCounts is completely free to use for public GitHub repositories. There is no account required, no API key, no sign-up, and no rate limit that is publicly documented. Both the web app and the browser extensions are free with no premium tier. The backend is open source, written in Rust using the Axum framework, and the frontend is written in React with TypeScript. If you prefer, you can self-host the entire stack; the source code is available on GitHub at github.com/huanglizhuo/OctoCounts.\n\nOctoCounts intentionally analyzes public repositories only. It does not request GitHub account access, does not support private repositories, and does not accept source-code uploads. OctoCounts has no advertising and collects no personal data."
          }
        },
        {
          "@type": "Question",
          "name": "What programming languages does OctoCounts support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "OctoCounts uses tokei for language detection, which supports over 200 programming languages and file types. Languages covered include Rust, Python, JavaScript, TypeScript, Go, Java, C, C++, C#, Ruby, Swift, Kotlin, PHP, Scala, Haskell, Elixir, Erlang, Clojure, F#, Lua, R, Julia, Dart, Perl, Shell, Bash, PowerShell, HTML, CSS, SCSS, SQL, GraphQL, Dockerfile, YAML, JSON, TOML, XML, Markdown, and many more.\n\ntokei detects languages primarily by file extension, with fallback to shebang lines and content-based detection for ambiguous files. It handles multi-language files and supports configuration to exclude specific directories such as node_modules, vendor, or build output folders. OctoCounts automatically skips heavy generated folders before passing the archive to tokei, which means the SLOC count reflects actual human-written source code rather than auto-generated files that would inflate the numbers."
          }
        },
        {
          "@type": "Question",
          "name": "Can I export the source line count results?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. OctoCounts supports three export formats available from the action buttons below the analysis results. Plain text copies a formatted table to your clipboard, showing language name, file count, total lines, code lines, comment lines, and blank lines in a column-aligned layout suitable for pasting into README files, GitHub issues, or documentation. JSON downloads the full structured report including per-language stats and aggregate totals, formatted for use in scripts, CI pipelines, or other tools that consume JSON.\n\nPNG downloads a 1200 × 630 image card showing the language breakdown, suitable for sharing on Twitter, LinkedIn, GitHub repository READMEs, or portfolio pages. The PNG card uses the same dark and light color palette as the web app and includes the repository name, total line count, and a language breakdown. All three formats are generated client-side from the analysis data already loaded in your browser, so no additional server request is needed."
          }
        },
        {
          "@type": "Question",
          "name": "Does OctoCounts support private repositories?",

            "@type": "Answer",
            "text": "OctoCounts supports public GitHub repositories only. It does not request GitHub account access, does not support private repositories, and does not accept source-code uploads. If you need to count lines of code in a private repository, run tokei locally. Download tokei from github.com/XAMPPRocky/tokei, clone your repository, and run tokei in the repository root. tokei is free, open source, and produces the same output format that OctoCounts uses."
          }
        }
      ]

        <h1>OctoCounts – GitHub SLOC Counter</h1>
        <p><strong>OctoCounts is a free SLOC counter for public GitHub repositories.</strong> It shows files, total lines, code, comments, blanks, and per-language totals without cloning. Install <a href="https://chromewebstore.google.com/detail/octocounts-%E2%80%94-github-sloc/gkgjpjdnaklagijmekoolhcpebmoldbj">OctoCounts from the Chrome Web Store</a>, <a href="https://microsoftedge.microsoft.com/addons/detail/octocounts-%E2%80%93-github-sloc-/ehifednhpbpekkadndaipnngopbhpoim">OctoCounts from Microsoft Edge Add-ons</a>, or <a href="https://addons.mozilla.org/en-US/firefox/addon/octocounts-github-sloc">OctoCounts from Firefox Add-ons</a> to see SLOC directly in GitHub's repo sidebar, or paste a public GitHub repo URL into the web app for a full report. OctoCounts downloads the archive tarball, runs <a href="https://github.com/XAMPPRocky/tokei">tokei</a>, caches the result by commit SHA, and returns a sortable breakdown without cloning. <time datetime="2026-09-05">Updated September 5, 2026.</time></p>

        <h2>Why use OctoCounts instead of cloning and running tokei locally?</h2>
        <p>OctoCounts downloads a compressed archive tarball rather than a full git clone with history, which is significantly faster for large repositories. It caches results by commit SHA, tokei version, and analysis options, so any repeated analysis of the same commit returns instantly with zero re-processing. There is nothing to install. Paste a public GitHub URL and get results in seconds.</p>

        <h2>What is OctoCounts?</h2>
        <p>OctoCounts is a source lines of code (SLOC) counter for public GitHub repositories. The browser extension adds a sidebar card on GitHub repo pages, then opens a full panel with files, total lines, code lines, comment lines, blank lines, language rows, local cache, auto-analyze settings, and placement settings. The web app resolves the requested branch, tag, or commit SHA via the host API, downloads the archive tarball, runs tokei in a background worker, and returns a language-by-language breakdown. Results are cached by commit SHA, tokei version, and analysis options so repeat queries are instant.</p>

        <h2>How does OctoCounts work?</h2>
        <ol>
          <li><strong>Resolve:</strong> OctoCounts validates the GitHub URL and pins the run to a specific commit SHA using the GitHub API.</li>
          <li><strong>Count:</strong> The Rust backend (Axum + Tokio) downloads the repository archive, extracts it, and runs tokei for language statistics in a queued worker job.</li>
          <li><strong>Cache:</strong> Reports are stored by owner, repo, commit SHA, and tokei version. Re-analysis of the same commit is instant, with no re-download and no re-count.</li>
        </ol>

        <h2>Frequently Asked Questions</h2>

        <h3>What is SLOC?</h3>
        <p>SLOC stands for Source Lines of Code. It is a software metric used to measure the size of a program by counting lines in its source code. OctoCounts reports total lines, code lines, comment lines, and blank lines per language, plus aggregate totals across the repository.</p>

        <h3>What programming languages does OctoCounts support?</h3>
        <p>OctoCounts uses tokei for language detection, which supports over 200 programming languages and file types including Rust, Python, JavaScript, TypeScript, Go, Java, C, C++, Ruby, Swift, Kotlin, and many more.</p>

        <h3>Does OctoCounts have a browser extension?</h3>
        <p>Yes. Install <a href="https://chromewebstore.google.com/detail/octocounts-%E2%80%94-github-sloc/gkgjpjdnaklagijmekoolhcpebmoldbj">OctoCounts – GitHub SLOC & Code Statistics from the Chrome Web Store</a>, <a href="https://microsoftedge.microsoft.com/addons/detail/octocounts-%E2%80%93-github-sloc-/ehifednhpbpekkadndaipnngopbhpoim">OctoCounts – GitHub SLOC & Code Statistics from Microsoft Edge Add-ons</a>, or <a href="https://addons.mozilla.org/en-US/firefox/addon/octocounts-github-sloc">OctoCounts – GitHub SLOC & Code Statistics from Firefox Add-ons</a> to add a SLOC card directly to GitHub repository sidebars. The card shows repository line-count status and opens the full extension panel.</p>

        <h3>Is OctoCounts free to use?</h3>
        <p>Yes. OctoCounts is completely free to use for public GitHub repositories. No account or authentication is required.</p>

        <h3>Can I export the source line count results?</h3>
        <p>Yes. OctoCounts supports three export formats: plain text (copy to clipboard), JSON (full report with per-language stats), and a shareable PNG card showing the language breakdown at 1200×630 resolution.</p>

        <h3>Does OctoCounts support private repositories?</h3>
        <p>OctoCounts supports public GitHub repositories only. It does not request GitHub account access, does not support private repositories, and does not accept source-code uploads.</p>
