<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | OctoCounts</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "JetBrains Mono", monospace;
        background: oklch(5% 0.010 148);
        color: oklch(96% 0.035 148);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }
      .box { max-width: 480px; text-align: center; }
      h1 { font-size: 3rem; color: oklch(87% 0.240 148); margin-bottom: 1rem; }
      p { color: oklch(74% 0.055 148); margin-bottom: 2rem; line-height: 1.6; }
      a {
        color: oklch(87% 0.240 148);
        text-decoration: none;
        border-bottom: 1px solid oklch(87% 0.240 148);
        padding-bottom: 2px;
      }
      a:hover { color: oklch(80% 0.115 220); border-color: oklch(80% 0.115 220); }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>404</h1>
      <p>Page not found. The URL you requested does not exist.</p>
      <p><a href="/">← Back to OctoCounts</a></p>
    </div>
  </body>
</html>
