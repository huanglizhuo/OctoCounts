# Local preview only: production SEO routes require Cloudflare Pages Functions.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-2mUsir+xXgBNxPOKDMVv/T0CDFNTPTwA4NyqXmyIU4Y=' https://cloud.umami.is https://static.cloudflareinsights.com https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: https://www.google.com https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://api.octocounts.com https://cloud.umami.is https://gateway.umami.is https://cloudflareinsights.com https://plausible.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header Cache-Control "no-transform" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

  # Hashed assets - immutable, 1 year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Font assets are unchanged across builds; fixed image names are not immutable.
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* ^/octocounts-.*\.webp$ {
    expires 1d;
    add_header Cache-Control "public, stale-while-revalidate=86400";
  }

  # expires -1 emits no-cache while retaining the server's security headers.
  location ~ ^/analytics(-runtime)?\.js$ {
    expires -1;
    try_files $uri =404;
  }

  # HTML - must revalidate
  location = /index.html {
    # A location-level add_header would discard the inherited security/noindex set.
    expires -1;
  }

  # Canonical documentation URLs are extensionless. Keep permanent redirects
  # for the legacy .html routes while serving the checked-in HTML files.
  location = /docs/github-sloc-counter { try_files /docs/github-sloc-counter.html =404; }
  location = /docs/github-sloc-counter.html { return 308 /docs/github-sloc-counter; }
  location = /docs/methodology { try_files /docs/methodology.html =404; }
  location = /docs/methodology.html { return 308 /docs/methodology; }
  location = /docs/api { try_files /docs/api.html =404; }
  location = /docs/api.html { return 308 /docs/api; }

  location = /zh/docs/github-sloc-counter {
    if ($arg_format = md) { rewrite ^ /zh/docs/github-sloc-counter.md last; }
    try_files /zh/docs/github-sloc-counter.html =404;
  }
  location = /zh/docs/github-sloc-counter/ { return 308 /zh/docs/github-sloc-counter$is_args$args; }
  location = /zh/docs/github-sloc-counter.html { return 308 /zh/docs/github-sloc-counter$is_args$args; }

  location = /zh/docs/methodology {
    if ($arg_format = md) { rewrite ^ /zh/docs/methodology.md last; }
    try_files /zh/docs/methodology.html =404;
  }
  location = /zh/docs/methodology/ { return 308 /zh/docs/methodology$is_args$args; }
  location = /zh/docs/methodology.html { return 308 /zh/docs/methodology$is_args$args; }

  # Static public files - 1 day
  location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|webmanifest)$ {
    expires 1d;
    add_header Cache-Control "public";
  }

  # The homepage ships prerendered (dist/home.html — the build emits it with
  # the full first-paint markup; scripts/prerender-home.mjs). Serve it at the
  # canonical / URL: `break` serves the file inside this location without
  # re-matching locations, so the redirect rule below cannot loop back here.
  # Cache headers default to Last-Modified revalidation; adding add_header
  # here would drop the inherited server-level security headers.
  location = / {
    if ($arg_lng = zh) { return 308 /zh$is_args$args; }
    rewrite ^ /home.html break;
  }
  # The prerendered assets are internal deployment files, not canonical URLs.
  location = /home.html { return 308 /; }
  location = /home-zh.html { return 308 /zh; }
  location = /zh { rewrite ^ /home-zh.html break; }
  location = /zh/ { return 308 /zh$is_args$args; }
  location /zh/ {
    types { text/html html; text/markdown md; }
    try_files $uri $uri.html =404;
  }

  # Known interactive routes work locally; unsupported server-rendered routes do not impersonate HTML.
  location ~ ^/(compare|diff|badges|recent|popular|trending|stats|hall-of-monoliths|extension)$ {
    try_files /index.html =404;
  }
  location ~ ^/(github|compare|growth|embed)/.*\.md$ { return 404; }
  location ~ ^/github/[^/]+/[^/]+(/(tree|commit)/.+)?$ {
    try_files /index.html =404;
  }
  location ~ ^/growth/[^/]+/[^/]+$ {
    try_files /index.html =404;
  }
  location ~ ^/embed/github/[^/]+/[^/]+$ {
    try_files /index.html =404;
  }

  # All static documents support their extensionless URLs; unknown paths are real 404s.
  location / {
    try_files $uri $uri.html =404;
  }

  # 404 page
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
