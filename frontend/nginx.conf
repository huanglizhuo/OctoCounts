server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gJFnkD2yqbv265Nlf3VSDL44MNt3DDcIc1ENS7V0cRY=' https://cloud.umami.is https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.octocounts.com https://cloud.umami.is https://gateway.umami.is https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header Cache-Control "no-transform" always;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

  # Hashed assets - immutable, 1 year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Versioned fonts and optimized image variants are safe to cache long-term.
  location ~* ^/(fonts/|octocounts-(light|dark)-card-768\.webp$|octocounts-logo-96\.webp$) {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # HTML - must revalidate
  location = /index.html {
    add_header Cache-Control "no-cache, no-transform";
  }

  # Canonical documentation URLs are extensionless. Keep permanent redirects
  # for the legacy .html routes while serving the checked-in HTML files.
  location = /docs/github-sloc-counter { try_files /docs/github-sloc-counter.html =404; }
  location = /docs/github-sloc-counter.html { return 308 /docs/github-sloc-counter; }
  location = /docs/methodology { try_files /docs/methodology.html =404; }
  location = /docs/methodology.html { return 308 /docs/methodology; }
  location = /docs/api { try_files /docs/api.html =404; }
  location = /docs/api.html { return 308 /docs/api; }

  # Static public files - 1 day
  location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|webmanifest)$ {
    expires 1d;
    add_header Cache-Control "public";
  }

  # The homepage ships prerendered (dist/home.html — the build emits it with
  # the full first-paint markup; scripts/prerender-home.mjs). Serve it at the
  # canonical / URL: `break` serves the file inside this location without
  # re-matching locations, so the redirect rule below cannot loop back here.
  # Cache headers default to Last-Modified revalidation; adding add_header
  # here would drop the inherited server-level security headers.
  location = / {
    rewrite ^ /home.html break;
  }
  # The prerendered assets are internal deployment files, not canonical URLs.
  location = /home.html { return 308 /; }
  location = /home-zh.html { return 308 /?lng=zh; }

  # SPA: serve index.html for other app routes, 404 for unknown paths
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 404 page
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
