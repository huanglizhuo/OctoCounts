server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.github.com; frame-ancestors 'self';" always;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

  # Hashed assets — immutable, 1 year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # HTML — must revalidate
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Static public files — 1 day
  location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|webmanifest)$ {
    expires 1d;
    add_header Cache-Control "public";
  }

  # SPA: serve index.html for root, 404 for unknown paths
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 404 page
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
